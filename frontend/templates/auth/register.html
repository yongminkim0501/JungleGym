{% extends "base.html" %} {% block title %}회원가입 페이지{% endblock %} {%
block content %}
<section class="flex w-full flex-1 items-center justify-center px-4 py-10">
  <form
    id="register-form"
    class="flex w-full max-w-xs flex-col gap-2"
    novalidate
  >
    {% if form is defined %} {{ form.hidden_tag() }} {% endif %}

    <h1 class="flex items-center gap-2 text-2xl font-semibold">

        width="158"
        height="33"

      </svg>
      <span class="text-neutral-900">회원가입</span>
    </h1>

    <p
      id="err-msg"
      role="alert"
      class="mt-3 hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600"
    ></p>

    <div class="flex w-full flex-col gap-5 py-4">
      <div class="flex w-full flex-col gap-4">
        <div class="flex flex-col gap-2">
          <label for="register-email" class="text-base text-neutral-900"
            >이메일</label
          >
          <input
            id="register-email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="이메일을 입력해주세요."
            class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="register-nickname" class="text-base text-neutral-900"
            >닉네임</label
          >
          <input
            id="register-nickname"
            name="nickname"
            type="text"
            required
            minlength="4"
            maxlength="25"
            autocomplete="nickname"
            placeholder="@Nickname를 입력해주세요."
            class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="register-name" class="text-base text-neutral-900"
            >이름</label
          >
          <input
            id="register-name"
            name="name"
            type="text"
            required
            maxlength="50"
            autocomplete="name"
            placeholder="이름을 입력해주세요."
            class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="register-password" class="text-base text-neutral-900"
            >비밀번호</label
          >
          <input
            id="register-password"
            name="password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="비밀번호를 입력해주세요."
            class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label
            for="register-password-confirm"
            class="text-base text-neutral-900"
            >비밀번호 확인</label
          >
          <input
            id="register-password-confirm"
            name="password_confirm"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="비밀번호를 입력해주세요."
            class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2"
          />
        </div>
      </div>

      <div class="flex flex-col md:flex-row w-full items-center justify-center gap-2 font-semibold pt-4">
        <a
          href="/login"
          class="w-full rounded-xl bg-neutral-100 px-6 py-3 text-center text-lg text-neutral-800 transition hover:bg-neutral-200/80 md:py-2"
          >돌아가기</a
        >
        <button
          id="register-submit-button"
          type="submit"
          class="w-full rounded-xl bg-neutral-800/95 px-6 py-3 text-center text-lg text-white transition hover:bg-neutral-800/90 disabled:cursor-not-allowed disabled:opacity-50 md:py-2 font-semibold"
        >
          회원가입
        </button>
      </div>

      <div class="flex items-center gap-2.5 text-neutral-500 text-base">
        <a href="/find-password" class="transition hover:text-neutral-700">비밀번호 찾기</a>
        <span>·</span>
        <a href="/find-id" class="transition hover:text-neutral-700">아이디 찾기</a>
      </div>
    </div>
  </form>
</section>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/form-validator.js') }}"></script>
<script src="{{ url_for('static', filename='js/controllers/auth-controller.js') }}"></script>
{% endblock %}
