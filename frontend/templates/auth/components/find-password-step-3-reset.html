<div id="find-password-step-3" class="hidden w-full flex-col gap-5 py-4">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="find-password-new" class="text-base text-neutral-900">새로운 비밀번호</label>
      <input
        id="find-password-new"
        name="password"
        type="password"
        required
        minlength="8"
        autocomplete="new-password"
        placeholder="비밀번호를 입력해주세요."
        class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="find-password-confirm" class="text-base text-neutral-900">비밀번호 확인</label>
      <input
        id="find-password-confirm"
        name="password_confirm"
        type="password"
        required
        minlength="8"
        autocomplete="new-password"
        placeholder="비밀번호를 입력해주세요."
        class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2"
      />
    </div>
  </div>

  <div class="flex items-center justify-between text-sm">
    <span class="text-neutral-500">비밀번호 변경 가능 시간</span>
    <span
      id="find-password-reset-timer"
      class="font-medium text-[#05D082]"
      aria-live="polite"
    >05:00</span>
  </div>

  <button
    id="find-password-reset-btn"
    type="submit"
    class="w-full rounded-xl bg-neutral-800/95 px-6 py-3 text-center text-lg text-white transition hover:bg-neutral-800/90 disabled:cursor-not-allowed disabled:opacity-50 md:py-2 font-semibold"
  >
    비밀번호 초기화
  </button>
</div>
