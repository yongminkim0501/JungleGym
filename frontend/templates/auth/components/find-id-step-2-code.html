<div id="find-id-step-2" class="hidden w-full flex-col gap-5 py-4">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="find-id-verified-email" class="text-base text-neutral-900">이메일</label>
      <div class="relative w-full">
        <input
          id="find-id-verified-email"
          type="email"
          readonly
          class="w-full rounded-xl border border-[#00103D]/12 bg-neutral-50 px-4 py-3 pr-24 text-neutral-600 outline-none md:px-3 md:py-2 md:pr-24"
        />
        <span
          id="find-id-code-timer"
          class="absolute right-[8px] top-1/2 -translate-y-1/2 rounded-lg bg-neutral-200 px-4 py-2 text-xs font-semibold tabular-nums text-neutral-700"
        >05:00</span>
      </div>
      <button
        id="find-id-resend-code-btn"
        type="button"
        class="hidden self-start rounded-lg bg-neutral-800/95 px-4 py-2 text-xs font-semibold text-white transition hover:bg-neutral-800/90 disabled:cursor-not-allowed disabled:opacity-50"
      >
        코드 재전송
      </button>
    </div>

    <div class="flex flex-col gap-2">
      <label for="find-id-code" class="text-base text-neutral-900">인증코드</label>
      <input
        id="find-id-code"
        name="verification_code"
        type="text"
        required
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="one-time-code"
        placeholder="인증코드 6자리를 입력해주세요."
        class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2"
      />
    </div>
  </div>

  <button
    id="find-id-step-2-next-btn"
    type="button"
    class="w-full rounded-xl bg-neutral-800/95 px-6 py-3 text-center text-lg text-white transition hover:bg-neutral-800/90 disabled:cursor-not-allowed disabled:opacity-50 md:py-2 font-semibold"
  >
    다음
  </button>
</div>
