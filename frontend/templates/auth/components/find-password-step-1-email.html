<div id="find-password-step-1" class="flex w-full flex-col gap-5 py-4">
  <div class="flex flex-col gap-2">
    <label for="find-password-email" class="text-base text-neutral-900">이메일</label>
    <div class="relative w-full">
      <input
        id="find-password-email"
        name="email"
        type="email"
        required
        autocomplete="email"
        placeholder="이메일을 입력해주세요."
        class="w-full rounded-xl border border-[#00103D]/12 px-4 py-3 pr-24 outline-none transition focus:border-[#05D082] focus:ring-1 focus:ring-inset focus:ring-[#05D082] md:px-3 md:py-2 md:pr-24"
      />
      <button
        id="find-password-send-code-btn"
        type="button"
        class="absolute right-[8px] top-1/2 -translate-y-1/2 rounded-lg bg-neutral-800/95 px-4 py-2 text-xs font-semibold text-white transition hover:bg-neutral-800/90 disabled:cursor-not-allowed disabled:opacity-50"
      >
        코드 전송
      </button>
    </div>
  </div>

  <button
    id="find-password-step-1-next-btn"
    type="button"
    class="w-full rounded-xl bg-neutral-800/95 px-6 py-3 text-center text-lg text-white transition hover:bg-neutral-800/90 disabled:cursor-not-allowed disabled:opacity-50 md:py-2 font-semibold"
    disabled
  >
    다음
  </button>
</div>
