<div
  id="check-out-modal"
  class="fixed inset-0 z-50 hidden min-h-screen w-screen flex-col items-center justify-center bg-neutral-800/30 p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="check-out-modal-title"
  aria-hidden="true"
  tabindex="-1"
>
  <div
    class="flex w-full max-w-md flex-col gap-4 rounded-2xl bg-white px-6 py-6 shadow-lg"
  >
    <h1
      id="check-out-modal-title"
      class="flex flex-col gap-2 text-xl font-semibold"
    >
      <div class="flex flex-row items-center justify-between">
        <span id="check-out-current-time" class="text-neutral-900 font-medium text-lg"></span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-log-out text-red-500"
          aria-hidden="true"
        >
          <path d="m17 16 4-4-4-4" />
          <path d="M21 12H9" />
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        </svg>
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-xl text-neutral-900 font-medium"
          ><span class="text-[#05D082] ">JUNGLE GYM</span>
          퇴실 하시겠습니까?</span
        >
      </div>
    </h1>

    <p
      id="check-out-error"
      role="alert"
      class="hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600"
    ></p>

    <div class="flex flex-col items-center justify-center gap-2">
      <button
        id="check-out-confirm-btn"
        type="button"
        class="w-full rounded-xl bg-neutral-800/95 px-6 py-3 text-center text-lg font-semibold text-white transition hover:bg-neutral-800/90 disabled:cursor-not-allowed disabled:opacity-60"
      >
        예, 퇴실하겠습니다.
      </button>
      <button
        id="check-out-cancel-btn"
        type="button"
        class="w-full rounded-xl bg-neutral-100 px-6 py-3 text-center text-lg font-semibold text-neutral-800 transition hover:bg-neutral-200/80"
      >
        아니요
      </button>
    </div>
  </div>
</div>
