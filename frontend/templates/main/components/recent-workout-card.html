{% set recent_image_url = (recent_workout_data.image_url or "")|trim %}
{% if recent_image_url %}
<div
  class="order-1 flex h-[200px] flex-col items-start rounded-xl bg-cover bg-center px-4 py-4 lg:order-none"
  style="
    background-image:
      linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent),
      url('{{ recent_image_url }}');
  "
>
  <a
    href="/mypage/history"
    class="group flex items-center gap-1 text-sm text-neutral-100 transition hover:text-neutral-200"
  >
    최근 오운완 기록
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-arrow-right group-hover:animate-arrow-right"
      aria-hidden="true"
    >
      <path d="M5 12h14" />
      <path d="m12 5 7 7-7 7" />
    </svg>
  </a>

  <h2 class="flex flex-col items-start gap-2 text-lg font-semibold">
    <span class="text-neutral-50">나의 변화를 확인해보세요.</span>
  </h2>
</div>
{% endif %}
